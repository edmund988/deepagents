name: Gatekeeper

# Thin caller into the shared reusable Gatekeeper in edmund988/gatekeeper: a deterministic
# layer (gitleaks secret scan, conflict-marker check, then .github/gatekeeper-validate.sh
# where present) and an independent Claude judgment layer posting one signed `Verdict:`
# comment. Pin by full commit SHA, never a branch or tag: this caller runs the reusable
# workflow with its own secrets, so a floating ref would hand them to an unreviewed change.
# Bump procedure and changelog: the gatekeeper repo's README.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  gatekeeper:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: edmund988/gatekeeper/.github/workflows/gatekeeper.yml@50205846e443aae8b71a0791309c16d304585a5b # v1.0.0

    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
